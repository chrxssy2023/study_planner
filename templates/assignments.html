{% extends "base.html" %}
<!-- Title of page -->
{% block main %}
<h2 class="page-title">All Assignments</h2>

<!-- Reminders table -->
<table>
    <tr>
        <!-- Sort by assignments -->
        <th>
            <a href="/assignments?sort=assignment_name&order={{ order }}">
                Assignments
            </a>
        </th>

        <!-- Sort by subject -->
        <th>
            <a href="/assignments?sort=subject_name&order={{ order }}">
                Subjects
            </a>
        </th>

        <!-- Sort by due date -->
        <th>
            <a href="/assignments?sort=due_date&order={{ order }}">
                Due Date
            </a>
        </th>

        <!-- Sort by priority -->
        <th>
            <a href="/assignments?sort=priority&order={{ order }}">
                Priority
            </a>
        </th>

        <!-- Sort by status -->
        <th>
            <a href="/assignments?sort=status&order={{ order }}">
                Status
            </a>
        </th>
    </tr>

     <!-- Display each subjects -->
    {% for row in assignments %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>

    <!-- Shows message if there are no reminders -->
    {% else %}
    <tr>
        <td colspan="5">No assignments found.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
