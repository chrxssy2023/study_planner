{% extends "base.html" %}

{% block main %}

<h2>{{ title }}</h2>

<table>
    <tr>
        <th>
            <a href="/sort/{{ title }}?sort=assignment&order={{ order }}">
                Assignment
            </a>
        </th>

        <th>
            <a href="/sort/{{ title }}?sort=subject&order={{ order }}">
                Subject
            </a>
        </th>
    </tr>

    {% for task in tasks %}
    <tr>
        <td>{{ task[0] }}</td>
        <td>{{ task[1] }}</td>
    </tr>

    {% else %}
    <tr>
        <td colspan="2">No results found.</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
