{% extends "base.html" %}

{% block main %}

<!-- Display the search result page title -->
<h1>{{ title }}</h1>

<!-- Display the matching search results in a table -->
<table>
    <tbody>

        <!-- Display headings for the search results -->
        <tr>

            <!--
            Sort the current search results by assignment name.
            The title contains the original search value so the
            same search results are kept when sorting.
            -->
            <th scope="col">
                <a href="/sort/{{ title }}?sort=assignment&order={{ order }}">
                    Assignment
                </a>
            </th>

            <!--
            Sort the current search results by subject name.
            The original search is kept when sorting.
            -->
            <th scope="col">
                <a href="/sort/{{ title }}?sort=subject&order={{ order }}">
                    Subject
                </a>
            </th>

        </tr>

        <!-- Loop through each matching search result -->
        {% for task in tasks %}

        <tr>

            <!-- Display the assignment name -->
            <td>{{ task[0] }}</td>

            <!-- Display the subject name -->
            <td>{{ task[1] }}</td>

        </tr>

        {% else %}

        <!-- Display a message if there are no matching results -->
        <tr>
            <td colspan="2">No results found.</td>
        </tr>

        {% endfor %}

    </tbody>
</table>

{% endblock %}
