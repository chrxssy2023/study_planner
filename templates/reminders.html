{% extends "base.html" %}

{% block main %}
<h2 class="page-title">All Reminders</h2>

<table>
    <tr>
        <th>
            <a href="/reminders?sort=assignment_name">
                Assignments
            </a>
        </th>
        <th>
            <a href="/reminders?sort=subject_name">
                Subjects
            </a>
        </th>
        <th>
            <a href="/reminders?sort=due_date">
                Due Date
            </a>
        </th>
        <th>
            <a href="/reminders?sort=priority">
                Priority
            </a>
        </th>
        <th>
            <a href="/reminders?sort=status">
                Status
            </a>
        </th>
    </tr>

    {% for row in reminders %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="5">No upcoming reminders.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
