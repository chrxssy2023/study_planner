{% extends "base.html" %}
<!-- Title of page -->
{% block main %}
<h2 class="page-title">{{ page_title }}</h2>

<!-- Reminders table -->
<table>
    <tr>
        <!-- Sort by assignment -->
        <th>
            <a href="/reminders?sort=assignment_name&order={{ order }}">
                Assignments
            </a>
        </th>

        <!-- Sort by subject -->
        <th>
            <a href="/reminders?sort=subject_name&order={{ order }}">
                Subjects
            </a>
        </th>

        <!-- Sort by due date -->
        <th>
            <a href="/reminders?sort=due_date&order={{ order }}">
                Due Date
            </a>
        </th>

        <!-- Sort by priority -->
        <th>
            <a href="/reminders?sort=priority&order={{ order }}">
                Priority
            </a>
        </th>

        <!-- Sort by status -->
        <th>
            <a href="/reminders?sort=status&order={{ order }}">
                Status
            </a>
        </th>
    </tr>

    <!-- Display each reminder -->
    {% for row in all_reminders %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>

    <!-- Shows message if there are no reminders -->
    {% else %}
    <tr>
        <td colspan="5">No upcoming reminders.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
