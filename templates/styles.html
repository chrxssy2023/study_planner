<!DOCTYPE html>
<html>

<head>
    <title>Styles Demo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <h1>Styles Page</h1>

    <p>This page demonstrates the CSS style.</p>

    <button>Example Button</button>

    <br><br>

    <input type="text" placeholder="Enter your name">

    <h2>Assignments</h2>

    <table>
        <thead>
            <tr>
                <th>Assignment(s)</th>
                <th>Due Date(s)</th>
            </tr>
        </thead>

        <tbody>
            {% for tag in tags %}
            <tr>
                <td>{{ tag[0] }}</td>
                <td>{{ tag[1] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br><br>

    <a href="/">Back Home</a>

</body>

</html>
