<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Planner</title>
    <link type="text/css" rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="top-header">
        <h1 class="site-title">Study Planner</h1>
        <div class="header-row">
            <div class="nav-bar">
                <nav class="main-nav">
                    <ul>
                    <li>
                        <a href=" ">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
                            Home
                        </a >
                    </li>
                    <li>
                        <a href="/assignments">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
                            Assignments
                        </a >
                    </li>
                    <li>
                        <a href="/subjects">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15.5A2.5 2.5 0 0 0 17.5 17H6.5A2.5 2.5 0 0 1 4 14.5V6.5z"/><path d="M4 8h16"/></svg>
                            Subjects
                        </a >
                    </li>
                    <li>
                        <a href="/calendar">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                            Calendar
                        </a >
                    </li>
                    <li>
                        <a href="#">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>
                            Notes
                        </a >
                    </li>
                    <li>
                        <a href="#">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                            Settings
                        </a >
                    </li>
                    </ul>
                </nav>
                <form class="search-form" method="POST" action="/search">
                    <div class="search-box">
                        <input type="text" name="search" id="search" placeholder="Search...">
                        <span class="search-icon" aria-hidden="true"></span>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <main>
        {% block main %}{% endblock %}
    </main>
</body>
</html>
