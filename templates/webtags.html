{% extends "base.html" %}

{% block main %}
        <h2>{{ title }}</h2>

            {% for tag in tags %}
            <article>
                <h3>{{ tag[0] }}</h3>
                <p>{{ tag[1] }}</p>
                <p>{{ tag[2] }}</p>
            </article>
            {% else %}
            <tr>
                <td colspan="2">No tags found.</td>
            </tr>
            {% endfor %}
        </tbody>
{% endblock %}
